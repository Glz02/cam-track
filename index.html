<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>后置摄像头运动跟踪</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:system-ui}
#container{position:relative;width:100vw;height:100vh;overflow:hidden}
video{position:absolute;width:100%;height:100%;object-fit:cover}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
#tip{position:absolute;top:16px;left:16px;z-index:10;font-size:14px;background:rgba(0,0,0,0.6);padding:8px;border-radius:6px}
#startBtn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:20;padding:16px 32px;font-size:18px;background:#007aff;color:#fff;border:none;border-radius:12px;}
</style>
</head>
<body>
<div id="container">
  <div id="tip">点击按钮开启后置摄像头</div>
  <button id="startBtn">点击启动相机</button>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('overlay');
const ctx = canvas.getContext('2d');
const tip = document.getElementById('tip');
const startBtn = document.getElementById('startBtn');

let w,h;
let prevFrame;
const sensitivity = 28;

// iPhone必须点击手势内调用摄像头
startBtn.addEventListener('click',async ()=>{
  startBtn.style.display='none';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'environment'}
    });
    video.srcObject = stream;
    await new Promise(res=>video.onloadedmetadata=res);
    w = video.videoWidth;
    h = video.videoHeight;
    canvas.width = w;
    canvas.height = h;
    tip.innerText = "✅后置已开启，移动物体查看跟踪框";
    requestAnimationFrame(loop);
  }catch(err){
    tip.innerText = "❌失败："+err.message+"\n设置允许Safari相机权限";
    startBtn.style.display='block';
    console.error(err);
  }
})

function getGray(imgData,x,y){
  const i = (y*imgData.width + x)*4;
  const r = imgData.data[i];
  const g = imgData.data[i+1];
  const b = imgData.data[i+2];
  return (r+g+b)/3;
}

function loop(){
  ctx.drawImage(video,0,0,w,h);
  const curFrame = ctx.getImageData(0,0,w,h);

  if(prevFrame){
    const motionPoints = [];
    const step = 8;
    for(let y=0;y<h;y+=step){
      for(let x=0;x<w;x+=step){
        const g1 = getGray(curFrame,x,y);
        const g2 = getGray(prevFrame,x,y);
        if(Math.abs(g1-g2) > sensitivity){
          motionPoints.push({x,y});
        }
      }
    }
    if(motionPoints.length>10){
      let minX=w,maxX=0,minY=h,maxY=0;
      for(let p of motionPoints){
        minX = Math.min(minX,p.x);
        maxX = Math.max(maxX,p.x);
        minY = Math.min(minY,p.y);
        maxY = Math.max(maxY,p.y);
      }
      ctx.strokeStyle="#00ff00";
      ctx.lineWidth=4;
      ctx.strokeRect(minX,minY,maxX-minX,maxY-minY);
    }
  }
  prevFrame = curFrame;
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
